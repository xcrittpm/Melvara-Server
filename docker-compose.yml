# Sonora Server: búsqueda en Last.fm y lista de deseos para la app Sonora, junto a tu Navidrome.
# Publícalo en  <tu-navidrome>-api.<dominio>  (p. ej. navidrome.ejemplo.com → navidrome-api.ejemplo.com;
# si Navidrome está en el dominio principal ejemplo.com → sonora-api.ejemplo.com). La app lo busca ahí sola.

services:
  sonora-server:
    build: .
    image: sonora-server:latest
    container_name: sonora-server
    restart: unless-stopped
    environment:
      # Dirección de tu Navidrome vista DESDE el contenedor, p. ej. http://192.168.1.10:4533
      NAVIDROME_URL: ${NAVIDROME_URL}
      # Clave de API de Last.fm (gratis en last.fm/api/account/create). Sin ella no hay búsqueda en Last.fm.
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      # Secreto de esa clave: para que cada uno conecte su perfil de Last.fm sin crear claves.
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - sonora-data:/data
    ports:
      - "8095:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sonora-data:
